<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" role="img" aria-label="ACULYX">
  <defs>
    <linearGradient id="katana-grad-header" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D56BFF"/>
      <stop offset="50%" stop-color="#9B4DFF"/>
      <stop offset="100%" stop-color="#2dd4c4"/>
    </linearGradient>
    <filter id="glint" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D56BFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Stylized Katana Emblem -->
  <g transform="translate(2, 6)" filter="url(#glint)">
    <path d="M3 21l6-6m0 0l11-11a2 2 0 0 0-2.83-2.83L6.17 12.17M9 15l-3 3" stroke="url(#katana-grad-header)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Primary Brand Lettering: Crisp Space Grotesk -->
  <text x="32" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="0.08em" fill="#f0f6fc">ACULYX</text>
  <!-- Descriptor Subtitle: Crisp, High-Contrast IBM Plex Mono -->
  <text x="33" y="30.5" font-family="'IBM Plex Mono', 'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="7.5" letter-spacing="0.12em" fill="#7e9ab0">SECURITY RECON</text>
</svg>
