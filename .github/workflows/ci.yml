name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Test, Build & Verify Packaging
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit, scope, and fuzz tests
        run: npx vitest run

      - name: Build all extension distributions (Chrome, Firefox, Hunter)
        run: npm run build:all

      - name: Verify release tag and manifest version consistency
        run: |
          node << 'EOF'
          const fs = require('node:fs');
          const pkgVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const manifests = [
            'manifest.json',
            'manifest.firefox.json',
            'dist/manifest.json',
            'dist-firefox/manifest.json',
            'dist-hunter/manifest.json',
          ];
          for (const m of manifests) {
            const mv = JSON.parse(fs.readFileSync(m, 'utf8')).version;
            if (mv !== pkgVersion) {
              throw new Error(`Version mismatch: ${m} has ${mv}, expected ${pkgVersion}`);
            }
          }
          const ref = process.env.GITHUB_REF || '';
          const refName = process.env.GITHUB_REF_NAME || '';
          if (ref.startsWith('refs/tags/v') && refName !== `v${pkgVersion}`) {
            throw new Error(`Tag mismatch: tag ${refName} does not match v${pkgVersion}`);
          }
          console.log(`✓ Manifests aligned at version ${pkgVersion}${ref.startsWith('refs/tags/v') ? ` and tag ${refName}` : ''}`);
          EOF

      - name: Post-build artifact security & syntax checks
        run: npm run test:artifacts

      - name: Firefox AMO web-ext linter verification
        run: npm run lint:amo

      - name: Pack release archives to disposable output directory
        run: npm run pack -- --output-dir release-dist

      - name: Verify all four release packages (source, full, chrome, firefox)
        run: npm run verify:pack -- --target all --dir release-dist

      - name: Generate cryptographically verifiable artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: |
            release-dist/ACULYX-source.zip
            release-dist/ACULYX-full.zip
            release-dist/ACULYX-chrome.zip
            release-dist/ACULYX-firefox.zip
            release-dist/ACULYX.zip
            release-dist/SHA256SUMS

      - name: Publish GitHub Release and upload attested assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-dist/ACULYX-source.zip \
            release-dist/ACULYX-full.zip \
            release-dist/ACULYX-chrome.zip \
            release-dist/ACULYX-firefox.zip \
            release-dist/ACULYX.zip \
            release-dist/SHA256SUMS \
            --title "ACULYX ${{ github.ref_name }}" \
            --generate-notes

      - name: Archive release package artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.1
        if: github.event_name == 'push'
        with:
          name: aculyx-release-packages
          path: release-dist/
          retention-days: 30

      - name: Verify CLI & generate SARIF
        run: npx tsx src/cli.ts --input tests/fixtures/cli-sample.json --format sarif > aculyx.sarif

      - name: Archive SARIF report artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.1
        if: always() && hashFiles('aculyx.sarif') != ''
        with:
          name: aculyx-sarif-report
          path: aculyx.sarif
          retention-days: 14

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.11
        if: always() && hashFiles('aculyx.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: aculyx.sarif
          category: aculyx-headers

  e2e:
    name: End-to-End Extension Tests (Chromium & Firefox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium & Firefox)
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: xvfb-run --auto-servernum -- npm run test:e2e
