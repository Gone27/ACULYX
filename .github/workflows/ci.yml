name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ tests/

      - name: Unit and fuzz tests
        run: npx vitest run

      - name: Manifest and build integrity checks
        run: npx vitest run tests/security/artifact-scan.test.ts

      - name: Build Chrome extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Verify CLI & generate SARIF
        run: npx tsx src/cli.ts --input tests/fixtures/cli-sample.json --format sarif > seccheck.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('seccheck.sarif') != ''
        with:
          sarif_file: seccheck.sarif
          category: seccheck-headers

  e2e:
    name: End-to-End Extension Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Chrome extension
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

